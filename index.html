 note:"Ogni anno tutti aspettano Babbo Natale. Io arrivo il 6 gennaio, quando i regali sono già a casa. Nessuno pensa a me! In Italia c’è un proverbio: «L’Epifania tutte le feste porta via». Quest’anno voglio portare io i regali la notte del 24 dicembre.<br><i>(Testo scritto per questa classe)</i>",
 qs:[{t:"mc",k:"comprensione",q:"Perché è triste la Befana?",o:["Perché arriva il 6 gennaio e nessuno pensa a lei.","Perché non ha una scopa.","Perché non sa volare."],a:0,h:["","Nel testo non c’è la parola «scopa».","Nel testo non si parla di volare."],h1:"Cerca «Nessuno pensa a me».",r:"Nel testo: «Io arrivo il 6 gennaio … Nessuno pensa a me!»"},
     {t:"mc",k:"comprensione",q:"Che cosa vuole fare la Befana quest’anno?",o:["Portare i regali la notte del 24 dicembre","Aspettare il 6 gennaio","Andare a Milano"],a:0,h:["","Il 6 gennaio è il giorno in cui arriva ogni anno.","Nel testo non c’è Milano."],h1:"Cerca «Quest’anno voglio …».",r:"Nel testo: «Quest’anno voglio portare io i regali la notte del 24 dicembre»."},

   phase=1;var rv=buildReview(d.review);
   if(rv.qs.length){
    list=rv.qs;qi=0;
    $("rvh").innerHTML='<div class="rvh"><div class="tag">Caso riaperto</div>'+gl(rv.errd?("Controlla di nuovo i punti difficili: "+rv.topics.join(", ")+"."):"Un ultimo controllo con esercizi nuovi, prima della verifica.")+"</div>";
    ask();return;
   }
  }
  if(d.final){showFinal();return;}
  finish();
 }
 ask();
}
